# Windows Docker Desktop: copy .env.example → .env, then:
#   docker compose up -d --build
# Open http://localhost:8787
services:
  society:
    build: .
    image: society-chat:local
    container_name: society-chat
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      # Outer container isolation; per-agent still path-isolated in workspace
      SOCIETY_SANDBOX_MODE: docker
      SOCIETY_OBSERVE_HOST: "0.0.0.0"
      SOCIETY_OBSERVE_PORT: "8787"
      # Browser → Docker published port is not 127.0.0.1 inside the container
      SOCIETY_OBSERVE_ALLOW_REMOTE_SAY: "1"
      # 0 = unlimited ticks while live UI is up
      SOCIETY_MAX_TICKS: "0"
      SOCIETY_MAX_EXCHANGES: "${SOCIETY_MAX_EXCHANGES:-0}"
      # Faster cadence (was 2000): more agent acts + world ticks per wall-minute
      SOCIETY_TICK_MS: "800"
      # Physics steps after each scheduler tick (LLM-bound); was 1 → sparse world ticks
      SOCIETY_WORLD_STEPS_PER_TICK: "1"
      # Synced turn: max wait per agent LLM (0 = agentTickBudgetMs)
      SOCIETY_TURN_TIMEOUT_MS: "25000"
      SOCIETY_WORLD_LLM_TIMEOUT_MS: "20000"
      SOCIETY_MAX_PARALLEL_REPLIES: "${SOCIETY_MAX_PARALLEL_REPLIES:-5}"
      SOCIETY_IDLE_STALE_MS: "1000"
      SOCIETY_AGENT_COOLDOWN_MS: "200"
      SOCIETY_COOLDOWN_MS: "250"
    volumes:
      # Persist agents / rooms / memory / soul / workspaces on the host
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
